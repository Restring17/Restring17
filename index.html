<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
</head>
<body>
    <!-- Encabezado -->
    <header class="encabezado">
        <div class="logo-galeria">Mi Galería</div>
        <nav class="navegacion">
            <a href="#inicio" class="activo">Inicio</a>
            <a href="#galeria">Galería</a>
            <a href="#servicios">Servicios</a>
            <a href="#contacto">Contacto</a>
        </nav>
        <link rel="stylesheet" href="styles.css">
    </header>

    <main class="principal">
        <h1 class="titulo-seccion">Galería de Imágenes</h1>
        
        <div class="galeria">
            <div class="elemento-galeria">
                <img src="img/img1.jpg" alt="JazzyRecords">
            </div>
            
            <div class="elemento-galeria">
                <img src="img/img2.png" alt="City">
            </div>
            
            <div class="elemento-galeria">
                <img src="img/img3.jpg" alt="China">
            </div>
            
            <div class="elemento-galeria">
                <img src="img/img4.jpg" alt="Kojima">
            </div>
            
            <div class="elemento-galeria">
                <img src="img/img5.jpg" alt="Landescape">
            </div>
            
            <div class="elemento-galeria">
                <img src="img/img6.png" alt="Cyberpunk">
            </div>
            
            <div class="elemento-galeria">
                <img src="img/img7.jpg" alt="Windows">
            </div>
            
            <div class="elemento-galeria">
                <img src="img/img8.jpg" alt="Steampunk">
            </div>
            
            <div class="elemento-galeria">
                <img src="img/img9.png" alt="Night City">
            </div>
        </div>
    </main>

    <footer class="pie">
        <p>&copy; 2025 Mi Galería. Todos los derechos reservados.</p>
        <div class="enlaces-pie">
            <a href="#privacidad">Privacidad</a>
            <a href="#terminos">Términos</a>
            <a href="#soporte">Soporte</a>
        </div>
    </footer>

</body>
</html>
